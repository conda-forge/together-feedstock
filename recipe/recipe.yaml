context:
  name: together
  version: "2.38.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b989052dcb102813754cb89124cbb2393576dfc35d8dcafb940d2fae694a7a2b

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - httpx >=0.23.0,<1
    - pydantic >=1.9.0,<3
    - typing-extensions >=4.14,<5
    - anyio >=3.5.0,<5
    - distro >=1.7.0,<2
    - sniffio
    - cyclopts >=4.6.0,<5
    - rich >=14.2.0,<15
    - filelock >=3.13.1,<4
    - types-pyyaml >=6.0.12.20250915
    - tomli >=2.0.0,<3
    - detect-agent >=0.6.0,<1

  run_constraints:
    - httpx-aiohttp >=0.1.9
    - aiofiles >=25.0.0
    - pyarrow >=16.1.0

tests:
  - python:
      imports:
        - together
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: The Official Python Client for Together's API
  homepage: https://github.com/togethercomputer/together-py
  repository: https://github.com/togethercomputer/together-py

extra:
  recipe-maintainers:
    - timkpaine
